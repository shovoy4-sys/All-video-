<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎬 প্রিমিয়াম ভিডিও হাব</title>
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app-container {
            max-width: 560px;
            width: 100%;
            background: radial-gradient(circle at 10% 20%, #12101e, #03020a);
            min-height: 100vh;
            padding: 20px 16px 30px;
            box-shadow: 0 0 60px rgba(0,0,0,0.6);
        }
        /* Header */
        .premium-header {
            text-align: center;
            padding: 16px 0 24px;
            border-bottom: 2px solid rgba(255, 90, 130, 0.3);
            margin-bottom: 24px;
        }
        .premium-header h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #FF95B3, #FFBC6E, #FFE6A3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .premium-header p {
            color: #b0a0c0;
            font-size: 14px;
            margin-top: 6px;
            font-weight: 600;
            background: rgba(255,70,110,0.15);
            display: inline-block;
            padding: 4px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        /* Video Grid */
        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        /* Video Card */
        .video-card {
            background: rgba(22, 20, 38, 0.7);
            backdrop-filter: blur(14px);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(255, 110, 150, 0.5);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .video-card:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(255, 51, 102, 0.3);
        }
        /* Thumbnail */
        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0d0b1a;
            overflow: hidden;
        }
        .thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Play Overlay */
        .play-icon-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }
        .play-icon-overlay:hover {
            background: rgba(0, 0, 0, 0.15);
        }
        .play-icon-overlay svg {
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 0 20px rgba(255, 51, 102, 0.8));
            transition: transform 0.2s ease;
        }
        .video-card:hover .play-icon-overlay svg {
            transform: scale(1.05);
        }
        /* Footer */
        .video-card-footer {
            padding: 16px 18px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .video-title {
            font-weight: 700;
            font-size: 16px;
            color: #f0e0f0;
            letter-spacing: 0.3px;
        }
        /* Play Button */
        .play-btn {
            background: linear-gradient(105deg, #ff2b6d, #ff8f4d);
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 14px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .play-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 51, 102, 0.3);
        }
        .play-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1a162e;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6085;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Main Content -->
    <div id="mainContent">
        <div class="premium-header">
            <h1>🎬 প্রিমিয়াম ভিডিও হাব</h1>
            <p>🔥 এক্সক্লুসিভ কন্টেন্ট</p>
        </div>

        <div class="video-grid" id="videoGrid"></div>
    </div>
</div>

<script>
    /* =====================================================
       CONFIGURATION
    ===================================================== */

    // এখানে আপনার ডাইরেক্ট লিংকগুলো বসান (রাউন্ড-রবিন হবে)
    const REDIRECT_LINKS = [
        "https://otieu.com/4/9429975",
        "https://omg10.com/4/9446627",
        "https://omg10.com/4/9717825"
    ];

    /* =====================================================
       IMAGE LIST
    ===================================================== */

    const imageUrls = [
        "https://i.ibb.co.com/bRrgh9mD/IMG-20260822-221556-525.jpg",
        "https://i.ibb.co.com/3yJ9FYGL/IMG-20260822-221555-428.jpg",
        "https://i.ibb.co.com/BKZtNjN4/IMG-20260822-221554-429.jpg",
        "https://i.ibb.co.com/5xwYHGZf/IMG-20260822-221553-168.jpg",
        "https://i.ibb.co.com/hRT6G2g7/IMG-20260822-221551-005.jpg",
        "https://i.ibb.co.com/tMZ5xyL8/IMG-20260822-221548-616.jpg",
        "https://i.ibb.co.com/MxB3KRtW/IMG-20260822-221547-774.jpg",
        "https://i.ibb.co.com/hRDDWsfm/IMG-20260822-221546-925.jpg",
        "https://i.ibb.co.com/S43YwKzs/IMG-20260822-221544-925.jpg",
        "https://i.ibb.co.com/7dVjKHsq/IMG-20260822-221529-119.jpg",
        "https://i.ibb.co.com/21zXGV87/IMG-20260822-221527-824.jpg",
        "https://i.ibb.co.com/j96DYscF/IMG-20260822-221526-366.jpg",
        "https://i.ibb.co.com/1Jm81ybR/IMG-20260822-221524-729.jpg",
        "https://i.ibb.co.com/jvq57d9p/IMG-20260822-221455-554.jpg",
        "https://i.ibb.co.com/cX7BVL22/IMG-20260822-221445-158.jpg",
        "https://i.ibb.co.com/Y739DsXm/IMG-20260822-221444-320.jpg",
        "https://i.ibb.co.com/k2qJVjnV/IMG-20260822-221443-140.jpg",
        "https://i.ibb.co.com/fz1HNPF0/IMG-20260822-221442-522.jpg",
        "https://i.ibb.co.com/rKRhg88Z/IMG-20260822-221440-971.jpg",
        "https://i.ibb.co.com/VWJbRQ6M/IMG-20260822-221440-190.jpg",
        "https://i.ibb.co.com/3mM3ntKh/IMG-20260822-221435-521.jpg",
        "https://i.ibb.co.com/DPmCZLWH/IMG-20260822-221434-264.jpg",
        "https://i.ibb.co.com/zVWFsgbt/IMG-20260822-221433-098.jpg",
        "https://i.ibb.co.com/rKZfQYdV/IMG-20260822-221431-813.jpg",
        "https://i.ibb.co.com/YF32czR6/IMG-20260822-221430-955.jpg",
        "https://i.ibb.co.com/Gf78HQSn/IMG-20260822-221428-982.jpg",
        "https://i.ibb.co.com/Dfv9sF1p/IMG-20260822-221427-181.jpg"
    ];

    /* =====================================================
       VARIABLES
    ===================================================== */

    const uniqueImages = [...new Set(imageUrls)];
    const videoGrid = document.getElementById("videoGrid");

    // রাউন্ড-রবিন ইনডেক্স
    let linkIndex = 0;

    // একসাথে একাধিক ক্লিক আটকানোর জন্য
    let isProcessing = false;

    /* =====================================================
       ROUND-ROBIN REDIRECT
    ===================================================== */

    function redirectToNextLink() {
        // বর্তমান লিংক নিন
        const currentLink = REDIRECT_LINKS[linkIndex % REDIRECT_LINKS.length];
        
        // পরের ক্লিকের জন্য ইনডেক্স বাড়ান
        linkIndex++;

        console.log("➡️ Redirecting to:", currentLink);
        console.log("📊 Next link index:", linkIndex % REDIRECT_LINKS.length);

        // সরাসরি redirect
        window.location.href = currentLink;
    }

    /* =====================================================
       VIDEO CLICK HANDLER
    ===================================================== */

    function handleVideoClick(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        // একই সময়ে একাধিক ক্লিক আটকান
        if (isProcessing) {
            return;
        }

        isProcessing = true;

        // সরাসরি রাউন্ড-রবিন রিডাইরেক্ট
        redirectToNextLink();

        // ২ সেকেন্ড পর আবার ক্লিক করার অনুমতি (যদি রিডাইরেক্ট না হয়)
        setTimeout(() => {
            isProcessing = false;
        }, 2000);
    }

    /* =====================================================
       BUILD VIDEO GALLERY
    ===================================================== */

    function buildGallery() {
        if (!videoGrid) {
            return;
        }

        videoGrid.innerHTML = "";

        uniqueImages.forEach((imgUrl, index) => {
            /* ===============================
               CARD
            =============================== */
            const card = document.createElement("div");
            card.className = "video-card";

            /* ===============================
               THUMBNAIL
            =============================== */
            const thumbWrapper = document.createElement("div");
            thumbWrapper.className = "thumbnail-wrapper";

            /* ===============================
               IMAGE
            =============================== */
            const img = document.createElement("img");
            img.src = imgUrl;
            img.alt = `Video ${index + 1}`;
            img.loading = "lazy";

            img.onerror = function() {
                this.src = "https://placehold.co/600x400/1e1a2e/ff88aa?text=Image+Not+Found";
            };

            /* ===============================
               PLAY OVERLAY
            =============================== */
            const playOverlay = document.createElement("div");
            playOverlay.className = "play-icon-overlay";
            playOverlay.innerHTML = `
                <svg viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1">
                    <circle cx="12" cy="12" r="10" fill="rgba(0,0,0,0.5)" stroke="white" stroke-width="1.5"/>
                    <polygon points="10,8 16,12 10,16" fill="white"/>
                </svg>
            `;

            thumbWrapper.appendChild(img);
            thumbWrapper.appendChild(playOverlay);
            card.appendChild(thumbWrapper);

            /* ===============================
               FOOTER
            =============================== */
            const footer = document.createElement("div");
            footer.className = "video-card-footer";

            const title = document.createElement("span");
            title.className = "video-title";
            title.textContent = `🎬 ভিডিও ${index + 1}`;

            const playBtn = document.createElement("button");
            playBtn.className = "play-btn";
            playBtn.type = "button";
            playBtn.innerHTML = `
                <svg viewBox="0 0 24 24">
                    <polygon points="5,3 19,12 5,21" fill="white"/>
                </svg>
                প্লে ভিডিও
            `;

            footer.appendChild(title);
            footer.appendChild(playBtn);
            card.appendChild(footer);

            /* ===============================
               CLICK EVENT
            =============================== */
            card.addEventListener("click", handleVideoClick);
            
            playBtn.addEventListener("click", function(event) {
                event.preventDefault();
                event.stopPropagation();
                handleVideoClick(event);
            });

            videoGrid.appendChild(card);
        });
    }

    /* =====================================================
       PAGE LOAD
    ===================================================== */

    window.addEventListener("load", function() {
        buildGallery();
        console.log("✅ Premium Video Hub loaded (no Adsgram)");
        console.log("ℹ️ Click any card → Round-robin redirect");
        console.log("📋 Links:", REDIRECT_LINKS);
    });

    /* =====================================================
       TELEGRAM WEB APP
    ===================================================== */

    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
</script>

</body>
</html>
